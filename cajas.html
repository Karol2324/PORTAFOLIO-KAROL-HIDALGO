<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="Author" content="Karol Hidalgo">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Diana Hidalgo | Layout Semántico Profesional</title>

    <style>
        :root { --accent-purple: #800080; }
        body { background: #f5f5f5; margin: 0; font-family: sans-serif; }

        /* CONTENEDOR GENERAL */
        .wrapper-main {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .contenedor-celular {
            width: 380px;
            height: 750px;
            transform: scale(0.9);
            transform-origin: top center;
            border: 6px solid var(--accent-purple);
            background: white;
        }

        /* SECCIONES */
        .bloque-fila {
            height: 25%;
            border: 4px solid black;
            margin: 0 !important;
        }

        .unidad-caja {
            border: 3px solid black;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 14px;
            text-transform: uppercase;
        }

        /* COLORES */
        .verde { background: #e6f2df; }
        .azul { background: #dfe8f6; }
        .amarillo { background: #fff1cc; }
        .rosado { background: #fde6dc; }

        .tercio-altura { height: 33.33%; }
        .barra-20 { height: 20%; }

        /* RESPONSIVE */
        @media (max-width: 576px) {
            .contenedor-celular { width: 300px; height: 600px; transform: scale(0.75); }
            .unidad-caja { font-size: 11px; }
        }
    </style>
</head>

<body>

<main class="wrapper-main">

    <article class="container-fluid contenedor-celular p-0 overflow-hidden">

        <header class="row bloque-fila g-1">
            <section class="col-12 h-100 d-flex flex-column">
                <article class="unidad-caja verde flex-grow-1 mb-1">CAJA</article>
                <article class="unidad-caja azul flex-grow-1 mb-1">CAJA</article>
                <article class="unidad-caja amarillo flex-grow-1">CAJA</article>
            </section>
        </header>

        <section class="row bloque-fila g-1">
            <article class="col-8">
                <section class="unidad-caja rosado">CAJA</section>
            </article>
            <aside class="col-4 d-flex flex-column gap-1">
                <article class="unidad-caja rosado tercio-altura">CAJA</article>
                <article class="unidad-caja rosado tercio-altura">CAJA</article>
                <article class="unidad-caja rosado tercio-altura">CAJA</article>
            </aside>
        </section>

        <section class="row bloque-fila g-1">
            <article class="col-8">
                <section class="unidad-caja azul">CAJA</section>
            </article>
            <aside class="col-4 d-flex flex-column gap-1">
                <article class="unidad-caja azul tercio-altura">CAJA</article>
                <article class="unidad-caja azul tercio-altura">CAJA</article>
                <article class="unidad-caja azul tercio-altura">CAJA</article>
            </aside>
        </section>

        <footer class="row bloque-fila g-1">
            <section class="col-12 d-flex flex-column gap-1">
                <article class="unidad-caja verde barra-20">CAJA</article>

                <section class="row flex-grow-1 g-1 m-0">
                    <article class="col-3 p-0"><section class="unidad-caja verde">CAJA</section></article>
                    <article class="col-3 p-0"><section class="unidad-caja verde">CAJA</section></article>
                    <article class="col-3 p-0"><section class="unidad-caja verde">CAJA</section></article>
                    <article class="col-3 p-0"><section class="unidad-caja verde">CAJA</section></article>
                </section>

                <article class="unidad-caja verde barra-20">CAJA</article>
            </section>
        </footer>

    </article>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
